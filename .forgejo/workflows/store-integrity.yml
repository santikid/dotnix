name: Nix store integrity

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".forgejo/workflows/store-integrity.yml"
  schedule:
    - cron: "0 3 * * *"
      timezone: Europe/Vienna

concurrency:
  group: nix-store-integrity
  cancel-in-progress: false

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

jobs:
  verify:
    name: Verify aarch64-darwin store
    runs-on: nix-aarch64-darwin
    steps:
      - name: Verify and repair local Nix store contents
        run: /usr/bin/sudo -n /usr/local/sbin/nix-store-maintenance

  notify:
    name: Notify store integrity failure
    if: >-
      always() &&
      needs.verify.result != 'success'
    needs: verify
    runs-on: nix-x86_64-linux
    steps:
      - name: Send failure notification
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          : "${NTFY_URL:?NTFY_URL is unavailable in this workflow}"
          nix shell nixpkgs#curl --command curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --header 'Title: Nix store integrity repair failed' \
            --header 'Tags: x,floppy_disk' \
            --data "The Darwin runner store remains unhealthy (result: $VERIFY_RESULT)." \
            "$NTFY_URL"
