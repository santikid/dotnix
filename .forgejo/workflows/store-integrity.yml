name: Nix store integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
      timezone: Europe/Vienna

concurrency:
  group: nix-store-integrity-${{ matrix.target.name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ matrix.target.name }} store
    strategy:
      matrix:
        target:
          - name: aarch64-darwin
            runner: nix-aarch64-darwin
          - name: aarch64-linux
            runner: nix-aarch64-linux
          - name: x86_64-linux
            runner: nix-x86_64-linux
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Verify and repair local Nix store contents
        run: |
          if sudo nix store verify --store local --all --no-trust; then
            exit 0
          fi

          sudo env NIX_REMOTE= nix-store --verify --check-contents --repair
          sudo nix store verify --store local --all --no-trust
